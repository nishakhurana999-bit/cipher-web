<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER | Autonomous Sovereignty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --black: #000000; }
        body { background-color: var(--black); color: white; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
        .luxury-serif { font-family: 'Playfair Display', serif; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
        .cipher-input { background: transparent; border-bottom: 1px solid #1a1a1a; padding: 1rem 0; width: 100%; outline: none; transition: border-color 0.5s ease; border-radius: 0; color: white; }
        .cipher-input:focus { border-bottom-color: var(--gold); }
        .fade-in { animation: fadeIn 1.2s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-6 text-center">
    <div class="bg-glow"></div>

    <main id="main-content" class="max-w-4xl w-full py-20">
        <div id="hero-section" class="fade-in">
            <div class="inline-block border border-[#d4af37] px-4 py-1 text-[10px] tracking-[0.4em] text-[#d4af37] mb-12 uppercase">Connection: Secured</div>
            <h1 class="luxury-serif text-7xl md:text-9xl tracking-tighter mb-4">CIPHER</h1>
            <p class="text-xs uppercase tracking-[0.8em] text-[#d4af37] opacity-60 mb-20">Architecting the Invisible</p>
            <div class="max-w-md mx-auto space-y-12">
                <input type="password" id="passkey" placeholder="••••••••" class="cipher-input text-center tracking-[1em]">
                <button onclick="handleAccess()" class="mt-12 block w-full text-[10px] uppercase tracking-[0.5em] text-[#d4af37] hover:text-white transition-all">Initiate Vetting</button>
            </div>
        </div>

        <div id="vetting-section" class="hidden text-left space-y-16">
            <div class="border-l border-[#d4af37] pl-8">
                <h2 class="luxury-serif text-4xl text-white uppercase tracking-tighter">Infrastructure Audit</h2>
                <p class="text-xs opacity-50 mt-2">Submit data points for neural analysis.</p>
            </div>
            <form id="cipher-form" action="https://form.typeform.com/to/D5UvobRw" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <input type="text" name="name" required class="cipher-input" placeholder="Principal Name">
                <input type="email" name="email" required class="cipher-input" placeholder="Intelligence Email">
                <textarea name="leak" required rows="3" class="md:col-span-2 cipher-input" placeholder="Operational Friction / Leak"></textarea>
                <button type="submit" id="submit-btn" class="md:col-span-2 py-6 border border-[#d4af37] text-[10px] uppercase tracking-[0.5em] hover:bg-[#d4af37] hover:text-black transition-all">Submit for Review</button>
            </form>
        </div>

        <div id="success-section" class="hidden space-y-8 fade-in">
            <h2 class="luxury-serif text-5xl text-white uppercase">Archive Secured</h2>
            <p class="text-[#d4af37] tracking-[0.5em] text-[10px] uppercase">Audit in Progress</p>
            <p class="text-xs opacity-40 max-w-sm mx-auto italic">The Architect will analyze your leak. Silence is expected.</p>
        </div>
    </main>

    <script>
        function handleAccess() {
            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('vetting-section').classList.remove('hidden');
            document.getElementById('vetting-section').classList.add('fade-in');
        }

        const form = document.getElementById('cipher-form');
        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "ANALYZING NEURAL LEAKS...";
            btn.disabled = true;

            const data = new FormData(event.target);
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('vetting-section').classList.add('hidden');
                    document.getElementById('success-section').classList.remove('hidden');
                } else {
                    btn.innerText = "ERROR. TRY AGAIN.";
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
